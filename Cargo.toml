[package]
name = "syncora"
version = "1.0.0"
edition = "2021"
description = "Syncora - a friendly file and folder synchronization app"
authors = ["Syncora"]

[[bin]]
name = "Syncora"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
walkdir = "2.5"
blake3 = "1.8"
filetime = "0.2"
globset = "0.4"
rfd = "0.18"
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
sys-locale = "0.3"
tauri-winrt-notification = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
